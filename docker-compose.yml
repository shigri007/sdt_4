services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/steritrack.sqlite
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in shell or .env before the first run}
    volumes:
      - steritrack_data:/app/data
    restart: unless-stopped
volumes:
  steritrack_data:
